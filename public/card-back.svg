<!-- Original art only had visible content in its own top left corner, confirmed by
     the user after seeing it rendered full bleed. This repeats that same corner
     motif's full path data four separate times, once per quadrant, rather than a
     single copy referenced via defs plus use; an earlier attempt using that
     referencing approach rendered as totally blank, most likely because a same
     document fragment reference does not resolve reliably once this file is loaded
     as a CSS mask image resource instead of displayed directly. Each quadrant is
     wrapped in its own 640 by 640 nested svg element (one quadrant equals one
     quarter of the total area), which clips to its own viewBox by default, with an
     outer rotate around the full canvas's own center point (640, 640) followed by a
     translate remapping that quadrant's outer canvas coordinates back into the
     nested svg's own local 0 to 640 window. Net effect: the same top left ornament,
     rotated 90, 180, and 270 degrees to face each remaining corner, each confined to
     its own quadrant. -->
